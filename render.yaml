services:
  - type: web
    name: nzi-insights-pro-api-live
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && pip uninstall -y multipart || true && pip install python-multipart==0.0.20 && python -m playwright install chromium
    preDeployCommand: python apply_sql_migrations.py
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: wfm-data
      mountPath: /var/data/nzi-pro-api
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /var/data/nzi-pro-api/playwright-browsers
      - key: DB_BACKEND
        value: postgres
      - key: APP_ENV
        value: production
      - key: WFM_RAW_DATA_DIR
        value: /var/data/nzi-pro-api/wfm_raw_data
      - key: DATABASE_URL
        sync: false
      - key: NZI_JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: XERO_CLIENT_ID
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
      - key: XERO_REDIRECT_URI
        sync: false
      - key: XERO_TENANT_ID
        sync: false
      - key: XERO_SCOPE
        sync: false
      - key: XERO_AUTH_TYPE
        sync: false
      - key: XERO_ORGANISATION_NAME
        sync: false

  - type: web
    name: nzi-insights-pro-web-live
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: BACKEND_API_BASE_URL
        sync: false

  - type: web
    name: nzi-pro-web-clientportal
    runtime: node
    rootDir: portal
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: BACKEND_API_BASE_URL
        sync: false

  - type: web
    name: nzi-insights-pro-website-live
    runtime: node
    rootDir: website
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: BACKEND_API_BASE_URL
        sync: false

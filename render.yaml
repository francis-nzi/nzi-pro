services:
  - type: web
    name: nzi-pro-api-prod
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && pip uninstall -y multipart || true && pip install python-multipart==0.0.20 && python -m playwright install chromium
    startCommand: python apply_sql_migrations.py && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: wfm-data
      mountPath: /var/data/nzi-pro-api
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /var/data/nzi-pro-api/playwright-browsers
      - key: DB_BACKEND
        value: postgres
      - key: APP_ENV
        value: production
      - key: WFM_RAW_DATA_DIR
        value: /var/data/nzi-pro-api/wfm_raw_data
      - key: DATABASE_URL
        sync: false
      - key: NZI_JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: nzi-pro-web-prod
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://nzi-pro-api-prod.onrender.com
      - key: BACKEND_API_BASE_URL
        value: https://nzi-pro-api-prod.onrender.com

  - type: web
    name: nzi-pro-web-prototype
    runtime: node
    rootDir: frontend
    branch: prototype/job-top-nav-shell
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://nzi-pro-api-prod.onrender.com
      - key: BACKEND_API_BASE_URL
        value: https://nzi-pro-api-prod.onrender.com

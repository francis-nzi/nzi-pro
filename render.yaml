services:
  - type: web
    name: nzi-pro-api-prod
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && pip uninstall -y multipart || true && pip install python-multipart==0.0.20
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: wfm-data
      mountPath: /var/data/nzi-pro-api
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: DB_BACKEND
        value: postgres
      - key: APP_ENV
        value: production
      - key: WFM_RAW_DATA_DIR
        value: /var/data/nzi-pro-api/wfm_raw_data
      - key: DATABASE_URL
        sync: false
      - key: NZI_JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: nzi-pro-web-prod
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://nzi-pro-api-prod.onrender.com
      - key: BACKEND_API_BASE_URL
        value: https://nzi-pro-api-prod.onrender.com
